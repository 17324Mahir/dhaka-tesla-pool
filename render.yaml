services:
  - type: web
    name: dhaka-tesla-pool-api-mahir
    runtime: node
    plan: free
    region: singapore
    branch: master
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run prisma:generate && npm run build
    startCommand: npx prisma migrate deploy && npm run prisma:seed && npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: CORS_ORIGINS
        value: https://dhaka-tesla-pool-three.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
